name: Check Roblox Sales

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: check-roblox-sales
  cancel-in-progress: false

jobs:
  check-sales:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Queued runs must load the latest ledger, not their old event SHA.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Configure durable sale checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run sale checker
        env:
          PERSIST_STATE_TO_GIT: "1"
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          WEBHOOK_MOTION_WORKS: ${{ secrets.WEBHOOK_MOTION_WORKS }}
          WEBHOOK_EROSERIS: ${{ secrets.WEBHOOK_EROSERIS }}
          WEBHOOK_AMI_BERLOGA: ${{ secrets.WEBHOOK_AMI_BERLOGA }}
          WEBHOOK_BACKGROUND_CHECK: ${{ secrets.WEBHOOK_BACKGROUND_CHECK }}
        run: python scripts/check_sales.py
