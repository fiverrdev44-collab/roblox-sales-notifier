name: Check Roblox Sales

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: check-roblox-sales
  cancel-in-progress: false

jobs:
  check-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run sale checker
        env:
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          WEBHOOK_MOTION_WORKS: ${{ secrets.WEBHOOK_MOTION_WORKS }}
          WEBHOOK_EROSERIS: ${{ secrets.WEBHOOK_EROSERIS }}
          WEBHOOK_AMI_BERLOGA: ${{ secrets.WEBHOOK_AMI_BERLOGA }}
        run: python scripts/check_sales.py

      - name: Commit updated state file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/last_seen.json
          if ! git diff --staged --quiet; then
            git commit -m "Update last seen sales"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 2
            done
          fi
